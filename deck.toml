[package]
name = "@deckyard/geo"
version = "0.2.0-dev"
description = "Read, edit and write geographic coordinate formats - GPX, KML, KMZ, GeoJSON and the GML geometry subset - over one point model, with geodesy, track statistics, simplification, geohashes and map tiles"
license = "LGPL-3.0-only"
authors = ["mplx <mplx@jennifer-lang.dev>"]
capabilities = []
keywords = [
    "geo",
    "gpx",
    "kml",
    "kmz",
    "geojson",
    "gml",
    "gps",
    "coordinates",
    "waypoint",
    "track",
    "geodesy",
    "haversine",
    "geohash",
    "tiles",
]

[package.urls]
deck = "https://raw.githubusercontent.com/deckyard/deck-geo/main/deck.toml"
homepage = "https://github.com/deckyard/deck-geo"
manual = "https://deckyard.github.io/deck-geo/"

[engines]
jennifer = ">=0.26.0"
jennifer-tiny = ">=0.26.0"
